services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: sudarsan-portfolio-api

    env_file:
      - ./backend/.env

    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: "sqlite:///./portofolio.db"
      FRONTEND_ORIGIN: "http://localhost:5500, http://127.0.0.1:5500"

    ports:
      - "8000:8000"

    volumes:
      - type: bind
        source: ./backend/portofolio.db
        target: /app/portofolio.db
        bind:
          create_host_path: false

    restart: unless-stopped
